# =====================================================================
# Builds Chatterbox TTS API (GPU) + its web interface and publishes
# both to GitHub's image storage (ghcr.io) so Portainer can pull them.
#
# Resulting images:
#   ghcr.io/<username>/chatterbox-tts-api:gpu          (the API)
#   ghcr.io/<username>/chatterbox-tts-frontend:latest  (web interface)
#
# WHEN IT RUNS:
#   - Automatically whenever this fork's "main" branch changes
#     (for example after clicking "Sync fork" on GitHub)
#   - Manually: Actions tab -> this workflow -> "Run workflow"
#
# UPDATE ROUTINE:
#   1. GitHub fork page -> "Sync fork" -> "Update branch"
#   2. Wait for this workflow to finish (Actions tab, green check)
#   3. Portainer -> Stacks -> chatterbox -> "Update the stack"
#      with "Re-pull image" ON
#
# The two jobs below run side by side on separate build machines.
# =====================================================================

name: Build and publish GPU image

on:
  push:
    branches: [main]      # run when main changes
  workflow_dispatch:      # adds the manual "Run workflow" button

permissions:
  contents: read          # allowed to read the code
  packages: write         # allowed to publish images to ghcr.io

jobs:
  # ---------------------------------------------------------------
  # Job 1: the API (big CUDA/PyTorch image)
  # ---------------------------------------------------------------
  build-api:
    runs-on: ubuntu-latest
    steps:
      # GitHub's build machines come with lots of preinstalled software.
      # The CUDA/PyTorch image is huge, so delete what we don't need.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      # Download this repository's code onto the build machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Image names on ghcr.io must be all lowercase.
      - name: Make lowercase image name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Set up Docker's modern builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to ghcr.io with a temporary token GitHub provides.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build with the project's GPU Dockerfile and publish.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: ghcr.io/${{ env.OWNER }}/chatterbox-tts-api:gpu

  # ---------------------------------------------------------------
  # Job 2: the web interface (small; a website served by nginx)
  # ---------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Make lowercase image name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The project's own compose file builds this from the frontend folder.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/chatterbox-tts-frontend:latest
