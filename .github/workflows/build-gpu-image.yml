# =====================================================================
# Builds Chatterbox TTS API (GPU version) and publishes it to
# GitHub's image storage (ghcr.io) so Portainer can pull it.
#
# Resulting image:  ghcr.io/<your-github-username>/chatterbox-tts-api:gpu
#
# WHEN IT RUNS:
#   - Automatically whenever this fork's "main" branch changes
#     (for example after clicking "Sync fork" on GitHub)
#   - Manually: Actions tab -> this workflow -> "Run workflow"
#
# UPDATE ROUTINE:
#   1. GitHub fork page -> "Sync fork" -> "Update branch"
#   2. Wait for this workflow to finish (Actions tab, green check)
#   3. Portainer -> Stacks -> chatterbox -> "Update the stack"
#      with "Re-pull image" ON
# =====================================================================

name: Build and publish GPU image

on:
  push:
    branches: [main]      # run when main changes
  workflow_dispatch:      # adds the manual "Run workflow" button

permissions:
  contents: read          # allowed to read the code
  packages: write         # allowed to publish the image to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # GitHub's build machines come with lots of preinstalled software.
      # The CUDA/PyTorch image is huge, so delete what we don't need
      # to make room on the disk.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      # Download this repository's code onto the build machine.
      - name: Check out code
        uses: actions/checkout@v4

      # Image names on ghcr.io must be all lowercase, but GitHub
      # usernames can contain capitals. This makes a lowercase copy.
      - name: Make lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chatterbox-tts-api" >> "$GITHUB_ENV"

      # Set up Docker's modern builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to ghcr.io using a temporary token GitHub provides
      # automatically. You don't need to create any password.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build using the project's GPU Dockerfile and publish it.
      # context "." = the whole repo, same as the project's own
      # docker-compose.gpu.yml uses.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          push: true
          tags: ${{ env.IMAGE }}:gpu
